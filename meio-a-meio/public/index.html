<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meio a Meio: finanças da casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F6;--sf:#FFFFFF;--sf2:#E6E9F2;--ink:#181B38;--mu:#5C6283;--ln:#D8DCE8;
  --br:#2B2F8F;--br2:#4148C9;--onbr:#FFFFFF;
  --pos:#107A55;--posbg:#DDF3E9;--neg:#BE3833;--negbg:#FBE4E2;--warn:#9A5F0C;--warnbg:#FBEFD8;--info:#2F5FBF;--infobg:#E1EAFB;
  --shadow:0 1px 0 rgba(24,27,56,.04),0 8px 24px -12px rgba(24,27,56,.18);
  --disp:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10122A;--sf:#1A1D3B;--sf2:#252950;--ink:#ECEEFB;--mu:#A3A8CB;--ln:#2F345C;
  --br:#8990FF;--br2:#A6ABFF;--onbr:#0F1130;
  --pos:#4FD4A1;--posbg:#133A30;--neg:#FF8A83;--negbg:#46201F;--warn:#F2B75B;--warnbg:#3F2F14;--info:#8FB0FF;--infobg:#1D2A52;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10122A;--sf:#1A1D3B;--sf2:#252950;--ink:#ECEEFB;--mu:#A3A8CB;--ln:#2F345C;
  --br:#8990FF;--br2:#A6ABFF;--onbr:#0F1130;
  --pos:#4FD4A1;--posbg:#133A30;--neg:#FF8A83;--negbg:#46201F;--warn:#F2B75B;--warnbg:#3F2F14;--info:#8FB0FF;--infobg:#1D2A52;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--br2);outline-offset:2px;border-radius:10px}
img{max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em;margin:0}
h2{font-size:1.15rem;font-weight:700}
.mu{color:var(--mu)}
.sm{font-size:.84rem}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.grp{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 8px 6px 0;min-width:0;flex:1;text-align:left}
.grp b{font-family:var(--disp);font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .chev{color:var(--mu);font-size:.8rem}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--sf);display:grid;place-items:center;position:relative;box-shadow:var(--shadow);flex:none}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--neg);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.back{background:none;border:0;display:flex;align-items:center;gap:6px;padding:8px 0;font-weight:600}

main{padding:4px 0 150px}
section{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.link{background:none;border:0;color:var(--br2);font-weight:600;padding:4px 0}

/* cards */
.card{background:var(--sf);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sf);border-radius:18px;padding:14px;box-shadow:var(--shadow);border:0;text-align:left;display:block;width:100%}
.stat .l{font-size:.82rem;color:var(--mu);font-weight:500}
.stat .v{font-family:var(--disp);font-size:1.45rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hero: the seesaw */
.hero{background:var(--br);color:var(--onbr);border-radius:26px;padding:20px 18px 18px;position:relative;overflow:hidden}
.hero .say{font-family:var(--disp);font-size:clamp(1.45rem,6vw,1.9rem);font-weight:700;line-height:1.15;letter-spacing:-.02em;max-width:22ch}
.hero .say .amt{white-space:nowrap}
.hero .sub{opacity:.8;font-size:.9rem;margin-top:6px}
.saw{margin-top:18px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.saw .av{width:38px;height:38px;font-size:1rem;border:2px solid color-mix(in srgb,var(--onbr) 60%,transparent)}
.track{height:12px;border-radius:8px;background:color-mix(in srgb,var(--onbr) 18%,transparent);position:relative}
.track .mid{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;background:color-mix(in srgb,var(--onbr) 55%,transparent);border-radius:2px}
.track .fill{position:absolute;top:0;bottom:0;border-radius:8px;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.saw-l{display:flex;justify-content:space-between;font-size:.78rem;opacity:.85;margin-top:6px}
.hero .go{margin-top:16px;background:var(--onbr);color:var(--br);border:0;border-radius:14px;padding:10px 14px;font-weight:700}

/* list rows */
.list{background:var(--sf);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--ln)}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--sf2) 45%,transparent)}
.ic{width:40px;height:40px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;font-size:1.15rem;flex:none}
.row .mid{flex:1;min-width:0}
.row .t,.row .s{display:block}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .a{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:22px 16px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--ink);font-family:var(--disp);font-size:1.05rem;margin-bottom:4px}

.st{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:3px;white-space:nowrap}
.st-pago{background:var(--posbg);color:var(--pos)}
.st-pendente{background:var(--infobg);color:var(--info)}
.st-acertar{background:var(--sf2);color:var(--ink)}
.st-parcial{background:var(--warnbg);color:var(--warn)}
.st-atrasado{background:var(--negbg);color:var(--neg)}
.st-neutro{background:var(--sf2);color:var(--mu)}

.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;flex:none;object-fit:cover;border:2px solid transparent}
.av.lg{width:48px;height:48px;font-size:1.2rem}

/* chips & inputs */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--ln);background:var(--sf);border-radius:40px;padding:7px 13px;font-weight:600;font-size:.88rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--br);border-color:var(--br);color:var(--onbr)}
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:600;font-size:.88rem;color:var(--mu)}
.seg button[aria-pressed="true"]{background:var(--sf);color:var(--ink);box-shadow:var(--shadow)}
.fld{margin-top:16px}
.fld>label,.lbl{display:block;font-weight:600;font-size:.86rem;margin-bottom:7px}
.in{width:100%;border:1.5px solid var(--ln);background:var(--sf);border-radius:14px;padding:11px 13px;min-height:46px}
.in:focus{border-color:var(--br2);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ln);padding:4px 0}
.money span{font-family:var(--disp);font-size:1.4rem;color:var(--mu);font-weight:700}
.money input{border:0;background:none;font-family:var(--disp);font-size:2.4rem;font-weight:700;width:100%;padding:0;letter-spacing:-.02em;outline:none}
.hint{font-size:.8rem;color:var(--mu);margin-top:6px}
.err{background:var(--negbg);color:var(--neg);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.88rem;margin-top:14px}
.preview{background:var(--posbg);color:var(--pos);border-radius:14px;padding:12px 14px;font-weight:600;margin-top:14px}
.preview.neutral{background:var(--sf2);color:var(--ink)}
.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:700;background:var(--br);color:var(--onbr);width:100%;min-height:50px;font-size:1rem}
.btn.sec{background:var(--sf2);color:var(--ink)}
.btn.danger{background:var(--neg);color:#fff}
.btn.sm{width:auto;min-height:38px;padding:8px 14px;font-size:.88rem;border-radius:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1 1 140px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.toggle input{width:44px;height:26px;accent-color:var(--br)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding:0 6px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--mu)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--br)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 304px));bottom:calc(78px + env(safe-area-inset-bottom,0px));height:58px;border-radius:20px;border:0;background:var(--br);color:var(--onbr);font-weight:700;font-size:1rem;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px -10px color-mix(in srgb,var(--br) 70%,transparent)}
.fab svg{width:24px;height:24px}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.track .fill{transition:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--ln);margin:2px auto 10px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ph h2{font-size:1.25rem}
.x{border:0;background:var(--sf2);width:36px;height:36px;border-radius:12px;font-size:1.1rem;flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--ln)}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--mu)}
.kv span:last-child{text-align:right;font-weight:600}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
.hist{font-size:.84rem;border-left:2px solid var(--ln);padding:2px 0 2px 12px;margin:8px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs a,.thumbs .th{width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--sf2);display:grid;place-items:center;font-size:.7rem;text-align:center;color:var(--mu);text-decoration:none}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* bars & charts */
.bar{margin:10px 0}
.bar .bl{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:4px;gap:8px}
.bar .bt{height:10px;background:var(--sf2);border-radius:6px;overflow:hidden}
.bar .bf{height:100%;border-radius:6px;background:var(--br2)}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col .cb{width:100%;max-width:38px;background:var(--br2);border-radius:8px 8px 3px 3px;min-height:3px}
.col .cl{font-size:.7rem;color:var(--mu)}
.col .cv{font-size:.66rem;color:var(--mu);white-space:nowrap}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:22px;background:var(--sf);border-radius:50%}
.legend{display:grid;gap:8px;font-size:.88rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.ins{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--ln);font-size:.92rem}
.ins:first-child{border-top:0}
.ins i{font-style:normal;flex:none}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:.72rem;text-align:center;color:var(--mu);font-weight:600;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:0;background:var(--sf);border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:.86rem;min-width:0}
.cal button.o{visibility:hidden}
.cal button.td{outline:2px solid var(--br2)}
.cal .ds{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .ds i{width:6px;height:6px;border-radius:50%}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}
.monthnav b{font-family:var(--disp);font-size:1.1rem}
.monthnav button{border:0;background:var(--sf);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);font-size:1.1rem}
.banner{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:10px 14px;font-weight:600;font-size:.88rem;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;z-index:80;max-width:90%;box-shadow:var(--shadow)}
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px}
.brandmark{font-family:var(--disp);font-weight:800;font-size:2.4rem;letter-spacing:-.04em;line-height:1}
.brandmark em{font-style:normal;display:inline-block;transform:rotate(-8deg);color:var(--br2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--sf2);border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:600;color:var(--mu)}
.hscroll{overflow-x:auto}
@media (min-width:700px){.grid4{grid-template-columns:repeat(4,1fr)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
</head>
<body>
<div id="app"><div class="center"><div><div class="brandmark">Meio <em>a</em> Meio</div><p class="mu">Carregando…</p></div></div></div>
<div class="ov" id="ov" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/* ============ constantes ============ */
const PCOLORS=['#0E8C8F','#8B5CF6','#D9731C','#CF3F79','#2F7DD1','#5B8C1E'];
const CATS=['Mercado','Alimentação','Moradia','Energia','Água','Internet','Gás','Transporte','Saúde','Farmácia','Lazer','Streaming','Compras','Produtos de limpeza','Pets','Outros'];
const CAT_IC={Mercado:'🛒','Alimentação':'🍽️',Moradia:'🏠',Energia:'💡','Água':'💧',Internet:'📶','Gás':'🔥',Transporte:'🚌','Saúde':'🩺','Farmácia':'💊',Lazer:'🎟️',Streaming:'📺',Compras:'🛍️','Produtos de limpeza':'🧽',Pets:'🐾',Outros:'📦','Empréstimo':'🤝'};
const METHODS=['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Transferência','Boleto','Outro'];
const TYPES={individual:'Individual',shared:'Compartilhada',house:'Conta da casa',purchase:'Compra',loan:'Empréstimo'};
const FREQ={mensal:'Mensal',semanal:'Semanal',quinzenal:'Quinzenal',anual:'Anual',custom:'Personalizada'};
const STL={pendente:'Pendente',acertar:'A acertar',pago:'Pago',parcial:'Parcialmente pago',atrasado:'Atrasado'};
const GTYPES={casa:'Casa',casal:'Casal',republica:'República',familia:'Família',viagem:'Viagem'};
const NOTIF={vencendo:'Conta próxima do vencimento',vencida:'Conta vencida',parcela:'Parcela próxima',divida:'Dívida pendente',pagamento:'Pagamento registrado',nova:'Nova despesa compartilhada',alteracao:'Alteração de valor',recorrente:'Nova conta recorrente'};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36)+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>(b%36).toString(36)).join('');
const gidNew=()=>crypto.randomUUID().replace(/-/g,'');
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c||1)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n,day)=>{const d=parse(s);const dd=day||d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(dd,last));return iso(t)};
const ym=s=>(s||'').slice(0,7);
const ymAdd=(m,n)=>addMonths(m+'-01',n).slice(0,7);
const monthLabel=m=>{const[a,b]=m.split('-');return MESES[+b-1]+' de '+a};
const monthTitle=m=>{const l=monthLabel(m);return l.charAt(0).toUpperCase()+l.slice(1)};
const monthShort=m=>MESES[+m.split('-')[1]-1].slice(0,3);
const fd=s=>s?s.split('-').reverse().join('/'):'';
const fdt=s=>{if(!s)return'';const d=new Date(s);return iso(d).split('-').reverse().join('/')+' às '+z(d.getHours())+':'+z(d.getMinutes())};
const brl=c=>((c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const money=str=>{if(str==null)return NaN;let s=String(str).replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isNaN(v)?NaN:Math.round(v*100)};
const toInput=c=>c?(c/100).toFixed(2).replace('.',','):'';
const clampInt=(v,a,b)=>Math.max(a,Math.min(b,parseInt(v,10)||a));
const clean=o=>JSON.parse(JSON.stringify(o));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const sum=(arr,f)=>arr.reduce((s,x)=>s+(f?f(x):x),0);

function computeShares(amount,parts,split){
  const mode=split&&split.mode||'equal',v=split&&split.values||{},out={};
  if(!parts.length)throw new Error('Escolha quem participa da despesa.');
  if(mode==='equal'){const b=Math.floor(amount/parts.length);let r=amount-b*parts.length;parts.forEach(p=>{out[p]=b+(r>0?1:0);if(r>0)r--});return out}
  if(mode==='percent'){const tot=sum(parts,p=>+v[p]||0);if(Math.abs(tot-100)>0.01)throw new Error('As porcentagens precisam somar 100% (agora somam '+tot.toLocaleString('pt-BR')+'%).');let acc=0;parts.forEach((p,i)=>{out[p]=i===parts.length-1?amount-acc:Math.round(amount*(+v[p]||0)/100);acc+=out[p]});return out}
  const tot=sum(parts,p=>Math.round(+v[p]||0));if(tot!==amount)throw new Error('Os valores somam '+brl(tot)+', mas a despesa é de '+brl(amount)+'.');parts.forEach(p=>out[p]=Math.round(+v[p]||0));return out}
function scaledSplit(split,amount){if(!split||split.mode!=='amount')return split;const vals={};for(const p in split.values)vals[p]=amount?split.values[p]/amount*100:0;return{mode:'percent',values:vals}}
function reshare(t,amount){const parts=t.parts||Object.keys(t.shares||{});try{if(t.split&&t.split.mode==='amount'){const old=t.amount||1;return computeShares(amount,parts,{mode:'percent',values:Object.fromEntries(parts.map(p=>[p,(t.shares[p]||0)/old*100]))})}return computeShares(amount,parts,t.split)}catch(e){return computeShares(amount,parts,{mode:'equal'})}}

function txDebts(t){
  if(!t||t.deleted||!t.paid)return[];
  const contrib=t.contrib&&Object.keys(t.contrib).length?t.contrib:{[t.paidBy]:t.amount};
  const bal={};for(const p in contrib)bal[p]=(bal[p]||0)+(contrib[p]||0);for(const p in(t.shares||{}))bal[p]=(bal[p]||0)-(t.shares[p]||0);
  const cr=Object.entries(bal).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(e=>[e[0],e[1]]);
  const db=Object.entries(bal).filter(e=>e[1]<0).sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0])).map(e=>[e[0],-e[1]]);
  const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const m=Math.min(db[i][1],cr[j][1]);if(m>0)out.push({from:db[i][0],to:cr[j][0],amount:m});db[i][1]-=m;cr[j][1]-=m;if(db[i][1]<=0)i++;if(cr[j][1]<=0)j++}
  const td=today();
  return out.map(d=>{const paid=sum((t.payments||[]).filter(p=>p.from===d.from&&p.to===d.to),p=>p.amt);const rem=Math.max(0,d.amount-paid);
    let st=rem===0?'pago':paid>0?'parcial':'pendente';if(rem>0&&t.kind==='loan'&&t.due&&t.due<td)st='atrasado';return{...d,paid,rem,st,t}})}
const allDebts=()=>sharedTx().flatMap(txDebts);
function txStatus(t){const td=today();if(!t.paid)return(t.due&&t.due<td)?'atrasado':'pendente';const ds=txDebts(t).filter(d=>d.rem>0);if(!ds.length)return'pago';if(ds.some(d=>d.st==='atrasado'))return'atrasado';return ds.some(d=>d.paid>0)?'parcial':'acertar'}
function privStatus(x){if(x.paid)return'pago';return(x.due&&x.due<today())?'atrasado':'pendente'}
const itemStatus=it=>it.scope==='private'?privStatus(it):txStatus(it);
const stChip=st=>`<span class="st st-${st}">${STL[st]}</span>`;

function pairBalance(a,b){let owe=0,rec=0;const oweL=[],recL=[];for(const d of allDebts()){if(d.rem<=0)continue;if(d.from===a&&d.to===b){owe+=d.rem;oweL.push(d)}else if(d.from===b&&d.to===a){rec+=d.rem;recL.push(d)}}return{owe,rec,net:rec-owe,oweL,recL}}
function myTotals(){const me=myPid();let owe=0,rec=0;for(const d of allDebts()){if(d.rem<=0)continue;if(d.from===me)owe+=d.rem;if(d.to===me)rec+=d.rem}return{owe,rec}}

function advance(s,r){switch(r.freq){case'semanal':return addDays(s,7);case'quinzenal':return addDays(s,14);case'anual':return addMonths(s,12);case'custom':return addDays(s,Math.max(1,+r.every||30));default:return addMonths(s,1,r.day||parse(s).getDate())}}
function monthlyOf(r){const a=r.amount||0;switch(r.freq){case'semanal':return Math.round(a*52/12);case'quinzenal':return Math.round(a*26/12);case'anual':return Math.round(a/12);case'custom':return Math.round(a*30/Math.max(1,+r.every||30));default:return a}}

let genTimer=null;

async function generate(){
  if(S.genBusy||!S.ready.tx||!S.ready.rec||!S.gid||!myPid()||(G()&&G().closed))return;S.genBusy=true;
  const horizon=addDays(today(),35);
  try{
    for(const r of S.rec.filter(r=>r.active!==false&&!r.deleted))await genRec(r,'shared',horizon);
    if(S.uid&&S.ready.priv)for(const r of privRecs().filter(r=>r.active!==false))await genRec(r,'private',horizon);
  }catch(e){console.warn(e)}finally{S.genBusy=false}}
async function genRec(r,scope,horizon){
  let next=r.next,n=0;if(!next)return;
  while(next<=horizon&&n<24){
    const id='r-'+r.id+'-'+next;
    const exists=scope==='shared'?S.tx.some(t=>t.id===id):S.priv.some(t=>t.id===id);
    if(!exists){
      const hist=[{at:now(),by:S.uid,pid:myPid(),a:'Gerada automaticamente pela conta recorrente'}];
      if(scope==='shared'){let shares;try{shares=computeShares(r.amount,r.parts,r.split)}catch(e){shares=computeShares(r.amount,r.parts,{mode:'equal'})}
        await Store.set(gp('tx')+'/'+id,{kind:'house',desc:r.name,amount:r.amount,category:r.category,date:next,due:next,paid:false,paidBy:r.payer||'',shares,parts:r.parts,split:r.split,method:r.method||'',recId:r.id,variable:!!r.variable,payments:[],attach:[],createdBy:S.uid,createdAt:now(),auto:true,hist})}
      else await Store.set(pp()+'/'+id,{kind:'expense',desc:r.name,amount:r.amount,category:r.category,date:next,due:next,paid:false,method:r.method||'',cardId:r.cardId||'',recId:r.id,variable:!!r.variable,createdAt:now(),hist})}
    next=advance(next,r);n++}
  if(next!==r.next)await Store.update((scope==='shared'?gp('rec'):pp())+'/'+r.id,{next})}

const AUTH_ERR={'Invalid login credentials':'E-mail ou senha incorretos.','User already registered':'Já existe uma conta com este e-mail. Use Entrar.','Email not confirmed':'Confirme seu e-mail pelo link que enviamos antes de entrar.'};
async function authSubmit(){const m=AUTH.mode;const v=id=>{const el=$('#'+id);return el?el.value.trim():''};const email=v('lg1'),pass=$('#lgp')?$('#lgp').value:'',name=v('lgn');AUTH.email=email;
  if(m!=='newpass'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return authMsg('Informe um e-mail válido.');
  if(m!=='recover'&&pass.length<6)return authMsg('A senha precisa ter pelo menos 6 caracteres.');
  if(m==='up'&&!name)return authMsg('Informe seu nome.');
  const back=location.origin+location.pathname+location.search;let r;
  if(m==='up')r=await sb.auth.signUp({email,password:pass,options:{data:{name},emailRedirectTo:back}});
  else if(m==='in')r=await sb.auth.signInWithPassword({email,password:pass});
  else if(m==='recover')r=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});
  else r=await sb.auth.updateUser({password:pass});
  if(r.error)return authMsg(AUTH_ERR[r.error.message]||('Não deu certo: '+r.error.message));
  if(m==='recover')return authMsg('Pronto! Confira seu e-mail para criar uma nova senha.',true);
  if(m==='up'&&!r.data.session)return authMsg('Conta criada! Confirme pelo link que enviamos para '+email+' e depois entre.',true);
  location.reload()}

}

  const priv=privExp(),sh=sharedTx();
  const spent=sum(priv.filter(x=>inMonth(x,m)),x=>x.amount)+sum(sh.filter(t=>isSpend(t)&&inMonth(t,m)),t=>(t.shares||{})[me]||0);
  const toPayMine=sum(priv.filter(x=>!x.paid&&(ym(x.due||x.date)<=m)),x=>x.amount)+sum(sh.filter(t=>!t.paid&&isSpend(t)&&ym(t.due||t.date)<=m),t=>(t.shares||{})[me]||0);
  const houseM=sh.filter(t=>isSpend(t)&&inMonth(t,m));
  const upcoming=unifiedItems().filter(it=>!it.paid&&!it.archived&&(it.due||it.date)<=in7).sort((a,b)=>(a.due||a.date).localeCompare(b.due||b.date));

    <button class="stat" data-act="nav" data-v="settle"><div class="l">Devo</div><div class="v ${tot.owe?'neg':''}">${brl(tot.owe)}</div></button>
  </div>

  <section><div class="sh"><h2>${esc(G().name)}</h2><span class="mu sm">Gastos da casa no mês</span></div>

    <div class="chips" style="margin-top:8px">${late.length?`<span class="st st-atrasado">${late.length} atrasada${late.length>1?'s':''}</span>`:''}<span class="st st-pendente">${upcoming.length-late.length} vencendo em 7 dias</span><span class="st st-neutro">${openDebts.length} ${openDebts.length===1?'dívida em aberto':'dívidas em aberto'}</span></div>
    ${ppl.length>1?`<div style="margin-top:14px"><div class="lbl">Quem pagou e quem deveria pagar</div>${ppl.map(p=>`<div class="bar"><div class="bl"><span>${esc(pn(p.id))}</span><span class="mu">pagou <b class="num" style="color:var(--ink)">${brl(paidBy[p.id])}</b> de ${brl(should[p.id])}</span></div>

function heroHTML(){

function committed3(){const me=myPid(),td=today(),end=addMonths(td,3);let v=0;
  sharedTx().filter(t=>!t.paid&&t.inst&&(t.due||t.date)>td&&(t.due||t.date)<=end).forEach(t=>v+=(t.shares||{})[me]||0);
  privExp().filter(x=>!x.paid&&x.inst&&(x.due||x.date)>td&&(x.due||x.date)<=end).forEach(x=>v+=x.amount);
  S.rec.filter(r=>r.active!==false&&!r.deleted&&(r.parts||[]).includes(me)).forEach(r=>{let s;try{s=computeShares(monthlyOf(r),r.parts,r.split)[me]}catch(e){s=0}v+=s*3});
  privRecs().filter(r=>r.active!==false).forEach(r=>v+=monthlyOf(r)*3);return v}

function itemRow(it,noDate){
  const st=itemStatus(it);const me=myPid();const priv=it.scope==='private';
  let sub=[];if(it.due&&!it.paid)sub.push('vence '+fd(it.due));else if(noDate!==true)sub.push(fd(it.date));
  if(priv)sub.push('só você');else if(it.kind==='loan')sub.push(it.paidBy===me?'você emprestou':'emprestado para você');else if(it.paid)sub.push((it.contrib&&Object.keys(it.contrib).length>1?'pago em partes':pn(it.paidBy)+' pagou'));else sub.push('ainda não paga');
  if(it.inst)sub.push(`parcela ${it.inst.n}/${it.inst.of}`);if(it.recId)sub.push('recorrente');
  const mine=!priv&&it.kind!=='loan'&&it.shares&&it.shares[me]!=null&&it.shares[me]!==it.amount?`<div class="s">sua parte ${brl(it.shares[me])}</div>`:'';
  return `<button class="row" data-act="detail" data-scope="${it.scope}" data-id="${it.id}"><span class="ic">${it.kind==='loan'?'🤝':catIc(it.category)}</span>
  <span class="mid"><span class="t">${esc(it.desc)}${it.archived?' <span class="pill">arquivada</span>':''}</span><span class="s">${esc(sub.join(', '))}</span></span>
  <span class="r"><span class="a">${brl(it.amount)}</span>${mine}<div>${stChip(st)}</div></span></button>`}

/* ============ análise ============ */
function insights(){
  const me=myPid(),m=ym(today()),pm=ymAdd(m,-1),out=[];const sh=sharedTx().filter(isSpend);
  const byCat=(mm)=>{const o={};sh.filter(t=>inMonth(t,mm)).forEach(t=>o[t.category]=(o[t.category]||0)+t.amount);return o};
  const c1=byCat(m),c0=byCat(pm);
  const deltas=Object.keys({...c1,...c0}).filter(c=>c0[c]>0).map(c=>({c,d:(c1[c]||0)-c0[c],p:Math.round(((c1[c]||0)-c0[c])/c0[c]*100)})).filter(x=>Math.abs(x.p)>=10&&c1[x.c]).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  deltas.slice(0,2).forEach(x=>out.push(['📈',`Os gastos da casa com ${x.c.toLowerCase()} ${x.p>0?'aumentaram':'diminuíram'} ${Math.abs(x.p)}% em relação ao mês passado.`]));
  const recM=sum(S.rec.filter(r=>r.active!==false&&!r.deleted),monthlyOf);if(recM)out.push(['🔁',`${others().length>1?'O grupo tem':'Vocês têm'} ${brl(recM)} em despesas recorrentes mensais.`]);
  const groupsInst=new Set(unifiedItems().filter(t=>t.inst&&!t.paid).map(t=>t.inst.g));if(groupsInst.size)out.push(['🧾',groupsInst.size===1?'Existe 1 compra parcelada ainda em andamento.':`Existem ${groupsInst.size} compras parceladas ainda em andamento.`]);
  if(others().length===1){const o=others()[0].id;let a=0,b=0;sh.filter(t=>inMonth(t,m)&&t.paid).forEach(t=>{const c=t.contrib&&Object.keys(t.contrib).length?t.contrib:{[t.paidBy]:t.amount};a+=c[me]||0;b+=c[o]||0});
    if(a!==b&&(a||b))out.push(['⚖️',a>b?`Você pagou ${brl(a-b)} a mais que ${pnRaw(o)} neste mês.`:`${pnRaw(o)} pagou ${brl(b-a)} a mais que você neste mês.`])}
  const tot=sum(Object.values(c1));if(tot){const top=Object.entries(c1).sort((a,b)=>b[1]-a[1])[0];out.push(['🥧',`${top[0]} representa ${pct(top[1],tot)}% das despesas da casa neste mês.`])}
  return out}
function insightsCard(n){const ins=insights().slice(0,n);if(!ins.length)return'';return `<section><div class="sh"><h2>Resumo automático</h2>${n<9?'<button class="link" data-act="nav" data-v="reports">Relatórios</button>':''}</div><div class="card">${ins.map(i=>`<div class="ins"><i>${i[0]}</i><span>${esc(i[1])}</span></div>`).join('')}</div></section>`}

function filtered(){

  const[a,b]=f.from||f.to?[f.from||'0000',f.to||'9999']:[S.month+'-01',S.month+'-31'];
  items=items.filter(it=>inRange(it.date,a,b));
  if(!S.showArch)items=items.filter(it=>!it.archived);
  if(f.person)items=items.filter(it=>it.scope==='private'?f.person===me:(it.paidBy===f.person||(it.shares&&it.shares[f.person]!=null)||(it.contrib&&it.contrib[f.person])));
  if(f.cat)items=items.filter(it=>it.category===f.cat);
  if(f.st)items=items.filter(it=>f.st==='aberto'?itemStatus(it)!=='pago':itemStatus(it)===f.st);
  if(f.type)items=items.filter(it=>f.type==='individual'?it.scope==='private':it.kind===f.type);
  if(f.scope)items=items.filter(it=>f.scope==='private'?it.scope==='private':it.scope==='shared');
  if(f.rec)items=items.filter(it=>f.rec==='rec'?!!it.recId:!it.recId);
  if(f.method)items=items.filter(it=>it.method===f.method);
  return items.sort((x,y)=>y.date.localeCompare(x.date)||(y.createdAt||'').localeCompare(x.createdAt||''))}

  <section><div class="card"><div class="mu sm">${house?'Total gasto pela casa':'Total dos seus gastos'} de ${fd(a)} a ${fd(b>today()?today():b)}</div><div class="num" style="font-size:2rem;font-weight:800">${brl(total)}</div></div></section>

  ${pv2?`<section><div class="sh"><h2>Individuais x compartilhadas</h2></div><div class="card" style="display:flex;gap:18px;align-items:center"><div class="donut" style="background:${donut(pv2)}"></div><div class="legend">${pv2.map(p=>`<span><span class="dot" style="background:${p[2]}"></span>${p[0]}<br><b class="num">${brl(p[1])}</b></span>`).join('')}</div></div></section>`:''}

function alerts(){if(!S.ready.tx)return[];const P=prefs();const on=k=>!(P.notif&&P.notif[k]===false);const td=today(),in3=addDays(td,3),seen=P.seen||'';const me=myPid();const out=[];
  unifiedItems().filter(it=>!it.paid&&!it.archived&&(it.scope==='private'||(it.shares&&it.shares[me]!=null)||it.paidBy===me)).forEach(it=>{const d=it.due||it.date;
    if(d<td&&on('vencida'))out.push(['vencida','⚠️',`${it.desc} venceu em ${fd(d)}`,it]);
    else if(d<=in3&&d>=td){if(it.inst&&on('parcela'))out.push(['parcela','🧾',`Parcela ${it.inst.n}/${it.inst.of} de ${it.desc} vence ${d===td?'hoje':'em '+fd(d)}`,it]);else if(!it.inst&&on('vencendo'))out.push(['vencendo','📅',`${it.desc} vence ${d===td?'hoje':'em '+fd(d)}`,it])}});
  if(on('divida')){const t=myTotals();if(t.owe)out.push(['divida','💸',`Você tem ${brl(t.owe)} em dívidas pendentes`,null]);if(t.rec)out.push(['divida','💰',`Você tem ${brl(t.rec)} para receber`,null])}
  if(seen)sharedTx().forEach(t=>{if(on('nova')&&t.createdAt>seen&&t.createdBy!==S.uid&&!t.auto)out.push(['nova','🆕',`${pnRaw((t.hist&&t.hist[0]&&t.hist[0].pid)||t.paidBy)} registrou ${t.desc} (${brl(t.amount)})`,{...t,scope:'shared'}]);
    (t.payments||[]).forEach(p=>{if(on('pagamento')&&p.rec>seen&&p.uid!==S.uid)out.push(['pagamento','✅',`Pagamento de ${brl(p.amt)} de ${pnRaw(p.from)} para ${pnRaw(p.to)} registrado`,{...t,scope:'shared'}])});
    (t.hist||[]).forEach(h=>{if(on('alteracao')&&h.at>seen&&h.by!==S.uid&&/alterad|Editada/i.test(h.a))out.push(['alteracao','✏️',`${t.desc}: ${h.a}`,{...t,scope:'shared'}])})});
  if(seen&&on('recorrente'))S.rec.forEach(r=>{if(r.createdAt>seen&&r.createdBy!==S.uid)out.push(['recorrente','🔁',`Nova conta recorrente: ${r.name}`,null])});
  return out}

function updatePreview(){const el=$('#preview');if(!el||!S.form)return;const f=S.form,me=myPid();const amount=money(f.amount);if(!(amount>0)){el.innerHTML='';return}
  try{const t=buildShared(f,amount,true);const ds=txDebts({...t,amount,paid:true});if(!t.paid){el.innerHTML=`<div class="preview neutral">Divisão: ${Object.entries(t.shares).map(([p,v])=>esc(pn(p))+' '+brl(v)).join(', ')}. As dívidas são criadas quando a conta for paga.</div>`;return}
    el.innerHTML=`<div class="preview ${ds.length?'':'neutral'}">${ds.length?ds.map(d=>`${esc(d.from===me?'Você':pnRaw(d.from))} ${d.from===me?'vai dever':'vai dever'} ${brl(d.amount)} para ${esc(d.to===me?'você':pnRaw(d.to))}.`).join('<br>'):'Ninguém fica devendo nada.'}</div>`}
  catch(e){el.innerHTML=`<div class="preview neutral">${esc(e.message)}</div>`}}
function splitValsParsed(f){const o={};for(const p of f.parts)o[p]=f.splitMode==='amount'?money(f.splitVals[p]||'0')||0:parseFloat(String(f.splitVals[p]||'0').replace(',','.'))||0;return o}
function buildShared(f,amount){const parts=f.parts.filter(p=>person(p));const split={mode:parts.length>1?f.splitMode:'equal',values:parts.length>1&&f.splitMode!=='equal'?splitValsParsed(f):{}};
  const shares=computeShares(amount,parts,split);let paid=f.payer!=='none',paidBy=f.payer,contrib=null;
  if(f.payer==='split'){contrib={};let tot=0;for(const p of active()){const v=money(f.contrib[p.id]||'');if(v>0){contrib[p.id]=v;tot+=v}}if(tot!==amount)throw new Error('Os valores pagos somam '+brl(tot)+', mas a despesa é de '+brl(amount)+'.');paidBy=Object.keys(contrib)[0]}
  if(f.payer==='none')paidBy='';
  return{parts,split,shares,paid,paidBy,contrib}}
async function saveForm(){const f=S.form,me=myPid();const err=m=>{const e=$('#ferr');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'nearest'})};
  const amount=money(f.amount);if(!(amount>0))return err('Informe um valor maior que zero.');
  const desc=(f.desc||'').trim();if(!desc)return err('Informe uma descrição.');if(!f.date)return err('Informe a data.');
  if(f.editId)return saveEdit(amount,desc,err);
  const td=today();const cardName=f.card?(myCards().find(c=>c.id===f.card)||{}).name||'':'';const n=f.rec?1:clampInt(f.inst,1,72);
  if(n>1&&f.rec)return err('Escolha parcelado ou recorrente, não os dois.');
  const parcel=(k)=>{const b=Math.floor(amount/n);return k===n-1?amount-b*(n-1):b};const g=n>1?rid():null;
  let ok;
  if(f.type==='individual'){if(!S.uid)return err('Entre na sua conta para registrar despesas individuais.');
    ok=await write(async()=>{
      if(f.rec){const id=rid();const r={kind:'rec',name:desc,amount,variable:f.variable,category:f.category,freq:f.freq,every:clampInt(f.every,1,365),next:f.due||f.date,method:f.method,cardId:f.card,active:true,createdAt:now()};await Store.set(pp()+'/'+id,r)}
      else for(let k=0;k<n;k++){const date=addMonths(f.date,k),due=f.due?addMonths(f.due,k):'';const paid=n>1?(due||date)<=td:!(f.due&&f.due>td);
        await Store.set(pp()+'/'+rid(),{kind:'expense',desc,amount:parcel(k),category:f.category,date,due,paid,paidAt:paid?(n>1?(due||date):td):'',method:f.method,cardId:f.card,inst:g?{g,n:k+1,of:n,total:amount}:null,hist:[H(n>1?`Criada como parcela ${k+1}/${n} de ${brl(amount)}`:'Criada')],createdAt:now()})}});
    if(f.rec)schedGen()}
  else if(f.type==='loan'){const o=f.loanOther;if(!o||!person(o))return err('Escolha a outra pessoa do empréstimo.');const lent=f.loanDir==='lent';
    ok=await write(()=>Store.set(gp('tx')+'/'+rid(),{kind:'loan',desc,amount,category:'Empréstimo',date:f.date,due:f.due||'',paid:true,paidBy:lent?me:o,paidAt:f.date,shares:{[lent?o:me]:amount},parts:[lent?o:me],split:{mode:'equal',values:{}},method:f.method,payments:[],attach:f.attach,createdBy:S.uid,createdAt:now(),hist:[H(lent?`Empréstimo de ${pnRaw(me)} para ${pnRaw(o)}`:`Empréstimo de ${pnRaw(o)} para ${pnRaw(me)}`)]}))}
  else{let b;try{b=buildShared(f,amount)}catch(e){return err(e.message)}
    const base={kind:f.type,desc,category:f.category,method:f.method,card:cardName,cardId:f.card,parts:b.parts,split:b.split,attach:f.attach,payments:[],createdBy:S.uid};
    if(f.rec){const recId=rid();const payer=b.paidBy||me;let next=f.due||f.date;
      ok=await write(async()=>{
        if(b.paid){const id='r-'+recId+'-'+next;await Store.set(gp('tx')+'/'+id,{...base,kind:'house',amount,shares:b.shares,date:f.date,due:f.due||f.date,paid:true,paidBy:b.paidBy,contrib:b.contrib,paidAt:td,recId,variable:f.variable,createdAt:now(),hist:[H('Criada e marcada como paga')]});next=advance(next,{freq:f.freq,every:f.every})}
        await Store.set(gp('rec')+'/'+recId,{name:desc,amount,variable:f.variable,category:f.category,freq:f.freq,every:clampInt(f.every,1,365),day:parse(f.due||f.date).getDate(),next,payer,parts:b.parts,split:b.split,method:f.method,active:true,createdAt:now(),createdBy:S.uid})});schedGen()}
    else{const sp=scaledSplit(b.split,amount);
      ok=await write(async()=>{for(let k=0;k<n;k++){const a=parcel(k);const date=addMonths(f.date,k),due=f.due?addMonths(f.due,k):(n>1?date:'');const paid=b.paid&&(n===1||(due||date)<=td);
        const shares=n>1?computeShares(a,b.parts,sp):b.shares;
        await Store.set(gp('tx')+'/'+rid(),{...base,amount:a,shares,split:n>1?sp:b.split,date,due,paid,paidBy:b.paidBy,contrib:n===1?b.contrib:null,paidAt:paid?(n>1?(due||date):td):'',inst:g?{g,n:k+1,of:n,total:amount}:null,createdAt:now(),hist:[H(n>1?`Criada como parcela ${k+1}/${n} de ${brl(amount)}`:'Criada')]})}})}}
  if(ok){closeSheet();toast(f.type==='loan'?'Empréstimo registrado':'Movimentação registrada')}}
async function saveEdit(amount,desc,err){const f=S.form;const t=getItem(f.editScope,f.editId);if(!t)return closeSheet();const ch=[];
  if(t.amount!==amount)ch.push(`valor alterado de ${brl(t.amount)} para ${brl(amount)}`);if(t.desc!==desc)ch.push(`descrição alterada de "${t.desc}" para "${desc}"`);if(t.category!==f.category)ch.push(`categoria alterada para ${f.category}`);if(t.date!==f.date)ch.push(`data alterada para ${fd(f.date)}`);if((t.due||'')!==f.due)ch.push(`vencimento alterado para ${fd(f.due)||'sem vencimento'}`);if(t.method!==f.method)ch.push(`forma de pagamento: ${f.method}`);
  const patch={amount,desc,category:f.category,date:f.date,due:f.due,method:f.method};
  if(f.editScope==='private'){patch.cardId=f.card}
  else if(t.kind==='loan'){const lent=f.loanDir==='lent',me=myPid(),o=f.loanOther;patch.paidBy=lent?me:o;patch.shares={[lent?o:me]:amount};patch.parts=[lent?o:me]}
  else{let b;try{b=buildShared({...f,payer:f.payer},amount)}catch(e){return err(e.message)}
    const oldS=JSON.stringify(t.shares),newS=JSON.stringify(b.shares);if(oldS!==newS)ch.push('divisão recalculada: '+Object.entries(b.shares).map(([p,v])=>pnRaw(p)+' '+brl(v)).join(', '));
    if((t.paidBy||'')!==(b.paidBy||'')||!!t.paid!==b.paid)ch.push(b.paid?'quem pagou: '+(b.contrib?'em partes':pnRaw(b.paidBy)):'marcada como não paga');
    Object.assign(patch,{shares:b.shares,parts:b.parts,split:b.split,paid:b.paid,paidBy:b.paidBy,contrib:b.contrib,card:f.card?(myCards().find(c=>c.id===f.card)||{}).name||'':t.card||'',cardId:f.card||t.cardId||''});if(b.paid&&!t.paid)patch.paidAt=today()}
  if(!ch.length){closeSheet();return}
  patch.hist=(t.hist||[]).concat([H('Editada: '+ch.join('; ')+(t.paid?' (despesa já estava paga)':''))]);
  if(await write(()=>Store.update((f.editScope==='private'?pp():gp('tx'))+'/'+t.id,patch))){closeSheet();toast('Alterações salvas')}}
function editForm(scope,id){const t=getItem(scope,id);if(!t)return;const me=myPid();const f=newForm(scope==='private'?'individual':t.kind);

async function saveRec(){const f=S.form;const e=m=>{const x=$('#ferr');x.textContent=m;x.hidden=false};const amount=money(f.amount);if(!(amount>0))return e('Informe o valor.');if(!f.name.trim())return e('Informe o nome.');if(!f.next)return e('Informe o próximo vencimento.');

  if(f.scope==='shared'){const split={mode:f.parts.length>1?f.splitMode:'equal',values:{}};if(split.mode!=='equal')split.values=splitValsParsed(f);try{computeShares(amount,f.parts,split)}catch(x){return e(x.message)}Object.assign(body,{payer:f.payer,parts:f.parts,split})}
  const path=(f.scope==='shared'?gp('rec'):pp())+'/'+(f.id||rid());

  if(el.dataset.f&&S.form){const k=el.dataset.f.split('.');const v=el.type==='checkbox'?el.checked:el.value;if(k.length===2){S.form[k[0]]=S.form[k[0]]||{};S.form[k[0]][k[1]]=v}else S.form[k[0]]=v;if(el.dataset.live)updatePreview();if(el.dataset.rerender&&S.form.kind===undefined)renderForm();
    if(k[0]==='desc'&&S.form.kind===undefined&&!S.form.editId&&!S.form.catTouched){const c=guessCat(v);if(c&&cats().includes(c)&&c!==S.form.category){S.form.category=c;document.querySelectorAll('#panel [data-act=fset][data-k=category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===c)));const on=document.querySelector('#panel [data-act=fset][data-k=category][aria-pressed=true]');if(on)on.scrollIntoView({block:'nearest',inline:'center'})}}
    if(k[0]==='name'&&S.form.kind==='rec'&&!S.form.id&&!S.form.catTouched){const c=guessCat(v);const sel=document.querySelector('#panel select[data-f=category]');if(c&&sel&&cats().includes(c)){S.form.category=c;sel.value=c}}
    if(k[0]==='category'&&S.form.kind==='rec')S.form.catTouched=true}
  if(el.dataset.q!==undefined){S.q=el.value;const r=$('#qres');if(r)r.innerHTML=searchResults()}
  if(el.dataset.flt){S.f[el.dataset.flt]=el.value;render()}
  if(el.dataset.rp){S[el.dataset.rp]=el.value;render()}
  if(el.dataset.notif&&S.uid){const P=prefs();Store.set(pp()+'/prefs',{...P,kind:'prefs',notif:{...(P.notif||{}),[el.dataset.notif]:el.checked}}).catch(()=>toast('Não foi possível salvar.'))}});
document.addEventListener('change',async e=>{const el=e.target;if(!el.dataset.attach||!el.files||!el.files[0])return;const file=el.files[0];if(!S.assets)return;
  if(file.size>20*1024*1024){toast('Arquivo maior que 20 MB.');return}toast('Enviando anexo…');
  try{const r=await S.assets.upload(file);const a={id:r.id,name:file.name.slice(0,60),type:file.type};
    if(el.dataset.attach==='form'){S.form.attach=S.form.attach.concat(a);renderForm()}
    else{const t=S.tx.find(x=>x.id===el.dataset.attach);await write(()=>Store.update(gp('tx')+'/'+t.id,{attach:(t.attach||[]).concat(a),hist:(t.hist||[]).concat([H('Anexo adicionado: '+a.name)])}))}toast('Anexo salvo')}
  catch(x){toast('Não foi possível enviar o anexo.')}});
boot();
</script>
